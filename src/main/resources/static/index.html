<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ByteVault | Secure Storage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 600;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .upload-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-upload { width: 100%; }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.3);
        }

        .file-list {
            display: grid;
            gap: 1rem;
        }

        .file-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideUp 0.4s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-info span {
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
            min-height: 1.2rem;
        }

        .status.success { color: #4ade80; }
        .status.error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ByteVault</h1>
            <p class="subtitle">Secure, minimalist chunked storage</p>
        </header>

        <div class="upload-card">
            <div class="drop-zone" id="dropZone">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
                <p>Click or drag file to upload</p>
                <span id="fileNameDisplay" style="display: block; margin-top: 10px; color: var(--primary); font-weight: 600;"></span>
            </div>
            <input type="file" id="fileInput">
            <button class="btn btn-upload" id="uploadBtn" disabled>Upload to Vault</button>
            <div id="status" class="status"></div>
        </div>

        <div class="file-list" id="fileList">
            <!-- Files will be loaded here -->
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const status = document.getElementById('status');
        const fileList = document.getElementById('fileList');

        let selectedFile = null;

        const setStatus = (msg, type) => {
            status.textContent = msg;
            status.className = 'status ' + type;
        };

        const formatSize = (bytes) => {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        const loadFiles = async () => {
            try {
                const res = await fetch('/files');
                const files = await res.json();
                fileList.innerHTML = files.map(file => `
                    <div class="file-item">
                        <div class="file-info">
                            <h3>${file.fileName}</h3>
                            <span>${formatSize(file.size)} • ${file.totalChunks || 0} Chunks</span>
                        </div>
                        <div class="actions">
                            <a href="/files/download/${file.id}" target="_blank" class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.85rem; text-decoration: none;">Download</a>
                            <button class="btn btn-danger" onclick="deleteFile('${file.id}')">Delete</button>
                        </div>
                    </div>
                `).join('') || '<p style="text-align:center; color:var(--text-dim)">No files in vault yet.</p>';
            } catch (err) {
                console.error('Failed to load files', err);
            }
        };

        const deleteFile = async (id) => {
            if (!confirm('Are you sure you want to delete this file and all its chunks?')) return;
            try {
                const res = await fetch(`/files/${id}`, { method: 'DELETE' });
                if (res.ok) loadFiles();
            } catch (err) {
                console.error('Delete failed', err);
            }
        };

        dropZone.onclick = () => fileInput.click();
        
        fileInput.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileNameDisplay.textContent = selectedFile.name;
                uploadBtn.disabled = false;
            }
        };

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        };

        dropZone.ondragleave = () => dropZone.classList.remove('dragover');

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            selectedFile = e.dataTransfer.files[0];
            if (selectedFile) {
                fileNameDisplay.textContent = selectedFile.name;
                uploadBtn.disabled = false;
            }
        };

        uploadBtn.onclick = async () => {
            if (!selectedFile) return;
            const formData = new FormData();
            formData.append('file', selectedFile);
            uploadBtn.disabled = true;
            setStatus('Splitting into chunks and securing...', '');
            try {
                const res = await fetch('/files/upload', {
                    method: 'POST',
                    body: formData
                });
                if (res.ok) {
                    setStatus('File secured in vault!', 'success');
                    selectedFile = null;
                    fileNameDisplay.textContent = '';
                    fileInput.value = '';
                    loadFiles();
                } else {
                    setStatus('Upload failed.', 'error');
                }
            } catch (err) {
                setStatus('Error connecting to server.', 'error');
            } finally {
                uploadBtn.disabled = false;
            }
        };

        loadFiles();
    </script>
</body>
</html>
